name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.3"

jobs:
  check:
    name: lint · test
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The uv cache syncs only on GitHub-hosted runners: a self-hosted runner keeps
      # its own on local disk.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.14'
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      # The runner image ships no `just`. The official installer needs no marketplace
      # action or version pin beyond the script's own TLS pin. It installs into the
      # job's temp dir, which a self-hosted runner (no root) can write to.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install workspace
        run: uv sync --all-groups

      - name: Lint
        run: just lint

      - name: Test
        run: just test
